<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="tile" cx="0.5" cy="0.42" r="0.78">
      <stop offset="0" stop-color="#0d1c3d"/>
      <stop offset="1" stop-color="#050810"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cf8f0"/>
      <stop offset="0.55" stop-color="#38b6ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="16" y="16" width="480" height="480" rx="96"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)" opacity="0.6">
    <g transform="rotate(45 256 256)" stroke="#11254c" stroke-width="2">
      <line x1="-160" y1="32" x2="672" y2="32"/>
      <line x1="-160" y1="96" x2="672" y2="96"/>
      <line x1="-160" y1="160" x2="672" y2="160"/>
      <line x1="-160" y1="224" x2="672" y2="224"/>
      <line x1="-160" y1="288" x2="672" y2="288"/>
      <line x1="-160" y1="352" x2="672" y2="352"/>
      <line x1="-160" y1="416" x2="672" y2="416"/>
      <line x1="-160" y1="480" x2="672" y2="480"/>
    </g>
    <circle cx="430" cy="120" r="70" fill="#1a5ae0" opacity="0.22" filter="url(#glow)"/>
    <circle cx="80" cy="430" r="60" fill="#0e7490" opacity="0.18" filter="url(#glow)"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#132a55" stroke-width="3"/>

  <!-- Glow under-layer -->
  <g filter="url(#glow)" opacity="0.8" fill="none" stroke="#22d3ee" stroke-width="20" stroke-linejoin="miter">
    <!-- outer ring: open on the right side (mouth) -->
    <path d="M 348 118 L 200 118 L 118 200 L 118 312 L 200 394 L 340 394 L 398 336 L 398 318"/>
    <!-- inner ring -->
    <path d="M 318 168 L 218 168 L 168 218 L 168 294 L 218 344 L 300 344 L 344 300 L 344 274"/>
    <!-- jaw bar pointing into the mouth -->
    <path d="M 236 262 L 236 330 L 372 330 L 372 262"/>
  </g>

  <!-- Neon strokes -->
  <g fill="none" stroke-linejoin="miter" stroke-linecap="square">
    <!-- outer ring -->
    <path d="M 348 118 L 200 118 L 118 200 L 118 312 L 200 394 L 340 394 L 398 336 L 398 318" stroke="#081527" stroke-width="27"/>
    <path d="M 348 118 L 200 118 L 118 200 L 118 312 L 200 394 L 340 394 L 398 336 L 398 318" stroke="url(#neon)" stroke-width="12"/>
    <!-- inner ring -->
    <path d="M 318 168 L 218 168 L 168 218 L 168 294 L 218 344 L 300 344 L 344 300 L 344 274" stroke="#081527" stroke-width="27"/>
    <path d="M 318 168 L 218 168 L 168 218 L 168 294 L 218 344 L 300 344 L 344 300 L 344 274" stroke="url(#neon)" stroke-width="12"/>
    <!-- jaw bar -->
    <path d="M 236 262 L 236 330 L 372 330 L 372 262" stroke="#081527" stroke-width="27"/>
    <path d="M 236 262 L 236 330 L 372 330 L 372 262" stroke="url(#neon)" stroke-width="12"/>
  </g>

  <!-- Edge highlight -->
  <g stroke="#d9fdff" stroke-width="3.5" opacity="0.9" stroke-linecap="round">
    <line x1="205" y1="111" x2="330" y2="111"/>
    <line x1="111" y1="205" x2="111" y2="308"/>
  </g>

  <!-- Detached fragment top-right (mirrors the reference's broken corner) -->
  <g fill="none" stroke-linejoin="miter">
    <path d="M 366 106 L 396 106 L 424 134 L 424 164" stroke="#081527" stroke-width="24"/>
    <path d="M 366 106 L 396 106 L 424 134 L 424 164" stroke="#38b6ff" stroke-width="10" opacity="0.9"/>
  </g>

  <!-- Decorative slashes crossing the ring -->
  <g stroke-linecap="round">
    <line x1="290" y1="86" x2="322" y2="152" stroke="#050810" stroke-width="18"/>
    <line x1="293" y1="90" x2="319" y2="146" stroke="#2ea8ff" stroke-width="6" opacity="0.85"/>
    <line x1="222" y1="360" x2="190" y2="426" stroke="#050810" stroke-width="18"/>
    <line x1="219" y1="366" x2="193" y2="420" stroke="#2ea8ff" stroke-width="6" opacity="0.85"/>
  </g>

  <!-- Sparkles + dots -->
  <g stroke="#bff7ff" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="432" y1="222" x2="432" y2="246"/>
    <line x1="420" y1="234" x2="444" y2="234"/>
  </g>
  <g stroke="#8be9ff" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="86" y1="148" x2="86" y2="164"/>
    <line x1="78" y1="156" x2="94" y2="156"/>
  </g>
  <g fill="#22d3ee" filter="url(#glowSoft)">
    <circle cx="452" cy="362" r="5" opacity="0.8"/>
    <circle cx="70" cy="94" r="4" opacity="0.6"/>
    <circle cx="452" cy="94" r="3" opacity="0.55"/>
  </g>
</svg>
