<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="tile" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#0a1630"/>
      <stop offset="1" stop-color="#04070f"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cf8f0"/>
      <stop offset="0.55" stop-color="#38b6ff"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea8ff"/>
      <stop offset="1" stop-color="#3df5ec"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="glowSoft" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="16" y="16" width="480" height="480" rx="96"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)" opacity="0.6">
    <g transform="rotate(45 256 256)" stroke="#11254c" stroke-width="2">
      <line x1="-160" y1="32" x2="672" y2="32"/>
      <line x1="-160" y1="96" x2="672" y2="96"/>
      <line x1="-160" y1="160" x2="672" y2="160"/>
      <line x1="-160" y1="224" x2="672" y2="224"/>
      <line x1="-160" y1="288" x2="672" y2="288"/>
      <line x1="-160" y1="352" x2="672" y2="352"/>
      <line x1="-160" y1="416" x2="672" y2="416"/>
      <line x1="-160" y1="480" x2="672" y2="480"/>
    </g>
    <circle cx="430" cy="120" r="70" fill="#1a5ae0" opacity="0.22" filter="url(#glow)"/>
    <circle cx="80" cy="430" r="60" fill="#0e7490" opacity="0.18" filter="url(#glow)"/>
  </g>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#132a55" stroke-width="3"/>

  <!-- Glow layer -->
  <g filter="url(#glow)" opacity="0.85" fill="none" stroke-linejoin="miter">
    <path d="M 176 106 L 336 106 L 406 176 L 406 336 L 336 406 L 176 406 L 106 336 L 106 176 Z" stroke="#22d3ee" stroke-width="22"/>
    <path d="M 198 154 L 314 154 L 358 198 L 358 314 L 314 358 L 198 358 L 154 314 L 154 198 Z" stroke="#22d3ee" stroke-width="22"/>
    <rect x="240" y="252" width="160" height="76" rx="16" stroke="#22d3ee" stroke-width="22"/>
  </g>

  <!-- The G: outer loop + inner loop (stroked octagons) -->
  <g fill="none" stroke-linejoin="miter">
    <path d="M 176 106 L 336 106 L 406 176 L 406 336 L 336 406 L 176 406 L 106 336 L 106 176 Z" stroke="#081527" stroke-width="30"/>
    <path d="M 198 154 L 314 154 L 358 198 L 358 314 L 314 358 L 198 358 L 154 314 L 154 198 Z" stroke="#081527" stroke-width="30"/>
    <rect x="240" y="252" width="160" height="76" rx="16" stroke="#081527" stroke-width="30"/>
    <path d="M 176 106 L 336 106 L 406 176 L 406 336 L 336 406 L 176 406 L 106 336 L 106 176 Z" stroke="url(#neon)" stroke-width="13"/>
    <path d="M 198 154 L 314 154 L 358 198 L 358 314 L 314 358 L 198 358 L 154 314 L 154 198 Z" stroke="url(#neon)" stroke-width="13"/>
    <rect x="240" y="252" width="160" height="76" rx="16" stroke="url(#neonBar)" stroke-width="13"/>
  </g>
  <!-- Edge highlights -->
  <g stroke="#d9fdff" stroke-width="3.5" opacity="0.85" stroke-linecap="round">
    <line x1="180" y1="99" x2="330" y2="99"/>
    <line x1="99" y1="180" x2="99" y2="300"/>
  </g>

  <!-- Cut: open right side above the jaw bar (mouth) -->
  <rect x="292" y="132" width="160" height="212" fill="#04070f"/>
  <!-- Floating fragment top-right (detached by the mouth cut) -->
  <g stroke-linejoin="miter" fill="none">
    <path d="M 338 104 L 372 104 L 402 134 L 402 168" stroke="#0a1c38" stroke-width="24"/>
    <path d="M 338 104 L 372 104 L 402 134 L 402 168" stroke="#2ea8ff" stroke-width="11" opacity="0.9"/>
  </g>
  <!-- Decorative slashes through the ring -->
  <g fill="#04070f">
    <rect x="247" y="72" width="17" height="86" rx="6" transform="rotate(30 256 115)"/>
    <rect x="247" y="366" width="17" height="86" rx="6" transform="rotate(30 256 409)"/>
  </g>
  <g fill="none" stroke-linejoin="miter" opacity="0.75">
    <path d="M 296 78 L 313 104 L 296 130" stroke="#2ea8ff" stroke-width="6"/>
    <path d="M 216 382 L 199 408 L 216 434" stroke="#2ea8ff" stroke-width="6"/>
  </g>

  <!-- Sparkles + dots -->
  <g stroke="#bff7ff" stroke-width="4" stroke-linecap="round" opacity="0.9">
    <line x1="428" y1="222" x2="428" y2="246"/>
    <line x1="416" y1="234" x2="440" y2="234"/>
  </g>
  <g stroke="#8be9ff" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="88" y1="150" x2="88" y2="166"/>
    <line x1="80" y1="158" x2="96" y2="158"/>
  </g>
  <g fill="#22d3ee" filter="url(#glowSoft)">
    <circle cx="452" cy="360" r="5" opacity="0.8"/>
    <circle cx="70" cy="96" r="4" opacity="0.6"/>
    <circle cx="452" cy="96" r="3" opacity="0.55"/>
  </g>
</svg>
