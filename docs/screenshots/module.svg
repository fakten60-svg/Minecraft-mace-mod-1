<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#090b12"/><stop offset="1" stop-color="#121827"/></linearGradient></defs>
 <rect width="1400" height="820" fill="url(#bg)"/><circle cx="1180" cy="120" r="260" fill="#315ba8" opacity=".10"/>
 <text x="70" y="78" fill="#f8fafc" font-family="Inter,Arial" font-size="30" font-weight="700">Module im Detail</text><text x="70" y="112" fill="#94a3b8" font-family="Inter,Arial" font-size="17">MaceSwitch mit ausgeklappten Settings · Rechtsklick auf ein Modul</text>
 <g font-family="Inter,Arial">
  <rect x="70" y="145" width="560" height="640" rx="14" fill="#121722" stroke="#263550"/>
  <rect x="70" y="145" width="560" height="46" rx="14" fill="#0e1420"/>
  <text x="94" y="176" fill="#60a5fa" font-size="19" font-weight="700">COMBAT</text>
  <text x="94" y="230" fill="#e2e8f0" font-size="17">MaceSwitch</text><text x="576" y="230" fill="#60a5fa" font-size="16" text-anchor="end">ON</text>
  <g font-size="15" fill="#94a3b8">
   <text x="106" y="286">Target Lock Delay</text><text x="106" y="338">0 ms</text><text x="588" y="338" text-anchor="end">3000 ms</text>
   <text x="106" y="392">Initial Delay</text><text x="106" y="444">100 ms</text><text x="588" y="444" text-anchor="end">120 ms</text>
   <text x="106" y="498">Equip Delay</text><text x="106" y="550">70 ms</text><text x="588" y="550" text-anchor="end">80 ms</text>
   <text x="106" y="604">Attack Delay</text><text x="106" y="656">67 ms</text><text x="588" y="656" text-anchor="end">90 ms</text>
  </g>
  <g stroke="#233047" stroke-width="8" stroke-linecap="round">
   <path d="M106 312h482"/><path d="M106 418h482"/><path d="M106 524h482"/><path d="M106 630h482"/>
  </g>
  <g stroke="#60a5fa" stroke-width="8" stroke-linecap="round">
   <path d="M106 312h140"/><path d="M447 418h141"/><path d="M299 524h120"/><path d="M310 630h220"/>
  </g>
  <g fill="#f8fafc" stroke="#60a5fa" stroke-width="4">
   <circle cx="106" cy="312" r="8"/><circle cx="246" cy="312" r="8"/>
   <circle cx="447" cy="418" r="8"/><circle cx="588" cy="418" r="8"/>
   <circle cx="299" cy="524" r="8"/><circle cx="419" cy="524" r="8"/>
   <circle cx="310" cy="630" r="8"/><circle cx="530" cy="630" r="8"/>
  </g>
  <text x="106" y="700" fill="#94a3b8" font-size="15">Keybind</text><text x="588" y="700" fill="#64748b" font-size="15" text-anchor="end">NONE</text>
  <rect x="106" y="724" width="482" height="2" fill="#1c2536"/>
  <text x="106" y="758" fill="#475569" font-size="13">Zwei-Handles-Range-Bars · Min &lt; Max wird erzwungen · Werte landen direkt in der Combat-Logik</text>
  <rect x="680" y="145" width="650" height="640" rx="14" fill="#0d1320" stroke="#1c2536"/>
  <text x="704" y="190" fill="#f8fafc" font-size="18" font-weight="700">Was das Modul macht</text>
  <g font-size="16" fill="#cbd5e1">
   <text x="704" y="240">1. Ziel: Spieler ca. 3 Blöcke unterhalb, in Reichweite</text>
   <text x="704" y="286">2. Handitem als Brustplatte ausrüsten (Vanilla-Klicks)</text>
   <text x="704" y="332">3. Hotbar-Slot mit Mace anwählen (wie Scrollrad)</text>
   <text x="704" y="378">4. Normaler Angriff (attackEntity + Swing)</text>
  </g>
  <g font-size="15" fill="#94a3b8">
   <text x="704" y="440">Alle Delays sind Zufallsbereiche und frei einstellbar.</text>
   <text x="704" y="470">Die State Machine bricht sauber ab, wenn sich das Ziel</text>
   <text x="704" y="500">entfernt, der Spieler stirbt oder keine Mace liegt.</text>
  </g>
  <g font-size="15">
   <rect x="704" y="540" width="230" height="42" rx="8" fill="#16223a" stroke="#60a5fa"/><text x="724" y="567" fill="#60a5fa">Rechtsklick: Settings</text>
   <rect x="954" y="540" width="230" height="42" rx="8" fill="#101828" stroke="#263550"/><text x="974" y="567" fill="#94a3b8">Linksklick: ON/OFF</text>
   <rect x="704" y="596" width="230" height="42" rx="8" fill="#101828" stroke="#263550"/><text x="724" y="623" fill="#94a3b8">Keybind frei zuweisen</text>
   <rect x="954" y="596" width="230" height="42" rx="8" fill="#101828" stroke="#263550"/><text x="974" y="623" fill="#94a3b8">Reset: Standard-Timings</text>
  </g>
 </g>
 <text x="70" y="812" fill="#64748b" font-family="Inter,Arial" font-size="14">Illustrative UI preview · Farben, Werte und Layout sind im Spiel konfigurierbar</text>
